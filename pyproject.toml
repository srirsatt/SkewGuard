[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skewguard"
version = "0.1.0"
description = "An execution-based deploy-skew verifier for Django migrations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.1",
    "testcontainers[postgres]==4.15.0",
    "typer==0.27.3",
]

[project.scripts]
skewguard = "skewguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["skewguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["skewguard", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
